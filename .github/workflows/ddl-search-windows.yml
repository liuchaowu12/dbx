name: 构建 DDL 搜索修复版 Windows

on:
  push:
    branches: [build/ddl-search-windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: -C link-arg=/STACK:8388608
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.7
      - run: pnpm --filter dbx... install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
      - name: 构建安装包
        shell: pwsh
        run: |
          pnpm tauri build --bundles nsis --target x86_64-pc-windows-msvc --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: 验证并整理产物
        shell: pwsh
        run: |
          ./.github/scripts/assert-windows-stack-reserve.ps1 -BinaryPath "target/x86_64-pc-windows-msvc/release/dbx.exe"
          New-Item -ItemType Directory -Path artifacts/DBX-ddl-search -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/dbx.exe artifacts/DBX-ddl-search/DBX.exe
          Copy-Item LICENSE artifacts/DBX-ddl-search/LICENSE
          New-Item -ItemType File artifacts/DBX-ddl-search/portable.dbx -Force | Out-Null
          Compress-Archive artifacts/DBX-ddl-search artifacts/DBX-ddl-search-windows-x64-portable.zip
          Copy-Item target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe artifacts/
          Get-ChildItem artifacts -File | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content artifacts/SHA256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: DBX-ddl-search-windows-x64
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/SHA256.txt
          if-no-files-found: error
          retention-days: 14
